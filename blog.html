    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #333; margin: 0; padding: 0; }

<header style="background: #0f5132; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;">
  <a href="index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: white;">
    <img src="logo-mobile.png" alt="दीनी दुआ" style="height: 32px; width: 32px; border-radius: 6px; object-fit: contain;">

</header>

<div class="container">
  <h1 style="color:#0f5132; text-align:center; margin-top:20px;">दीनी दुआ - इस्लामिक ब्लॉग्स</h1>
  <p style="text-align:center; color:#6c757d; margin-bottom:30px;">Quran, Hadith aur Deen se jude ahmiyat bhare lekh.</p>

  <div id="publicBlogList"></div>
</div>

<script>
  function loadPublicBlogs() {
    const blogs = JSON.parse(localStorage.getItem('deeni_blogs')) || [];
    const container = document.getElementById("publicBlogList");
    container.innerHTML = "";

    if (blogs.length === 0) {
      container.innerHTML = "<p style='text-align:center; color:#777;'>abhi koi blog post uplabdh nahi hai.</p>";
      return;
    }

    blogs.forEach(blog => {
      const card = document.createElement("div");
      card.className = "blog-card";
      card.innerHTML = `
        <h2 class="blog-title">${escapeHtml(blog.title)}</h2>
        <div class="blog-date">📅 ${blog.date}</div>
        <div class="blog-body">${escapeHtml(blog.content)}</div>
      `;
      container.appendChild(card);
    });
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  window.onload = loadPublicBlogs;
</script>

</body>
