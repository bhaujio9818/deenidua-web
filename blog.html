<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDIc_0jZ3GSziO_s1wBB3Cz5radLDqM7Rg",
    authDomain: "deenidua-a5413.firebaseapp.com",
    projectId: "deenidua-a5413",
    storageBucket: "deenidua-a5413.firebasestorage.app",
    messagingSenderId: "494498303568",
    appId: "1:494498303568:web:921f12b2d7962d2928cb55"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const pageSize = 6;
  let lastVisible = null;
  let firstVisible = null;
  let currentPage = 1;
  let totalDocsCount = 0;

  // कुल पोस्ट्स की गिनती करना और पहले पेज का डेटा लोड करना
  async function initBlogs() {
    try {
      // कुल कितने ब्लॉग्स हैं यह पता लगाना ताकि पेजिनेशन सही से बने
      const countSnapshot = await db.collection("blogs").get();
      totalDocsCount = countSnapshot.size;

      if (totalDocsCount === 0) {
        document.getElementById("publicBlogList").innerHTML = "<p style='text-align:center; width:100%; color:#777;'>अभी कोई ब्लॉग पोस्ट उपलब्ध नहीं है।</p>";
        return;
      }

      loadPage(1);
    } catch (error) {
      document.getElementById("publicBlogList").innerHTML = "<p style='text-align:center; width:100%; color:red;'>पोस्ट लोड करने में त्रुटि हुई।</p>";
    }
  }

  // एक बार में सिर्फ 6 पोस्ट लाने का सुपर-फास्ट तरीका
  async function loadPage(page) {
    const container = document.getElementById("publicBlogList");
    container.innerHTML = "<p style='text-align:center; width:100%; color:#777;'>⏳ लोड हो रहा है...</p>";

    try {
      let query = db.collection("blogs").orderBy("createdAt", "desc").limit(pageSize);
      
      // अगर हम आगे के पेज पर जा रहे हैं, तो कर्सर का इस्तेमाल करें
      if (page > 1 && window.pageCursors && window.pageCursors[page]) {
        query = db.collection("blogs").orderBy("createdAt", "desc").startAfter(window.pageCursors[page]).limit(pageSize);
      }

      const snapshot = await query.get();
      if (snapshot.empty) {
        container.innerHTML = "<p style='text-align:center; width:100%; color:#777;'>कोई पोस्ट नहीं मिली।</p>";
        return;
      }

      // कर्सर सेव करना ताकि अगले पेज पर जाने में आसानी हो
      if (!window.pageCursors) window.pageCursors = {};
      window.pageCursors[page + 1] = snapshot.docs[snapshot.docs.length - 1];

      container.innerHTML = "";
      snapshot.forEach(doc => {
        const blog = doc.data();
        const id = doc.id;
        const views = blog.views || 1;
        const likes = blog.likes || 0;

        let imageHtml = "";
        if (blog.imageUrl) {
          imageHtml = `<img src="${blog.imageUrl}" alt="${escapeHtml(blog.title)}" style="width: 100%; height: 90px; object-fit: cover; border-radius: 6px; margin-bottom: 6px;">`;
        }

        const card = document.createElement("div");
        card.className = "blog-card";
        card.innerHTML = `
          <div>
            ${imageHtml}
            <h2 class="blog-title">${escapeHtml(blog.title)}</h2>
            <div class="blog-meta">
              <span>📅 ${blog.date || 'हाल ही में'}</span>
              <span>👁️ ${views} | ❤️ ${likes}</span>
            </div>
            <div class="blog-body">${escapeHtml(blog.content)}</div>
          </div>
          <div class="blog-footer">
            <a href="view-blog.html?id=${id}" class="action-btn">Read More →</a>
            <button class="action-btn share-btn" onclick="sharePost('${escapeHtml(blog.title)}', '${id}')">📤 शेयर</button>
          </div>
        `;
        container.appendChild(card);
      });

      currentPage = page;
      setupPaginationControls();
    } catch (error) {
      container.innerHTML = "<p style='text-align:center; width:100%; color:red;'>डेटा लोड करने में समस्या आई।</p>";
    }
  }

  // पेजिनेशन बटन बनाना
  function setupPaginationControls() {
    const totalPages = Math.ceil(totalDocsCount / pageSize);
    const paginationDiv = document.getElementById("paginationControls");
    if (totalPages <= 1) return;

    paginationDiv.style.display = "flex";
    paginationDiv.innerHTML = "";

    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement("button");
      btn.className = "page-btn " + (i === currentPage ? "active" : "");
      btn.innerText = i;
      btn.onclick = () => {
        loadPage(i);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      paginationDiv.appendChild(btn);
    }
  }

  function sharePost(title, id) {
    const shareUrl = window.location.origin + "/view-blog.html?id=" + id;
    const shareText = "दीनी दुआ लेख पढ़ें: " + title + " \n" + shareUrl;
    navigator.clipboard.writeText(shareText).then(() => {
      alert("✅ लिंक कॉपी हो गया है!");
    }).catch(() => {
      prompt("लिंक कॉपी करें:", shareUrl);
    });
  }

  function escapeHtml(text) {
    return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
  }

  window.onload = () => initBlogs();
</script>
