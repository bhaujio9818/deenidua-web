<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>दुआ रिक्वेस्ट वॉल - Deeni Dua</title>
    
    <!-- SEO Meta Tags for Dua Wall -->
    <meta name="description" content="Deeni Dua par apni pareshani ya dua share karein. Yahan hazaron muslim bhai-behen aapki dua mein ameen kahenge aur behtareen Islamic dua request wall ka anand lein.">
    <meta name="keywords" content="Islamic dua request, mere liye dua karein, online dua wall, deeni dua, aameen for dua, islamic community dua, dua for success hindi">
    <meta name="robots" content="index, follow">

    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4077161497406015" crossorigin="anonymous"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: var(--bg, #f4f6f8); color: var(--text, #333); margin: 0; padding: 0; line-height: 1.6; }
        .container { max-width: 600px; margin: 20px auto; background: var(--card, white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #047857; text-align: center; font-size: 22px; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; background: var(--card, #fff); color: inherit; }
        textarea { resize: vertical; height: 80px; }
        button.submit-btn { width: 100%; background: #047857; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button.submit-btn:hover { background: #065f46; }

        .wall-title { font-size: 18px; font-weight: bold; color: #1f2937; margin-top: 30px; margin-bottom: 15px; border-bottom: 2px solid #e5e7eb; padding-bottom: 5px; }
        
        .dua-card { background: #f0fdf4; border: 1px solid #a7f3d0; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .dua-name { font-weight: bold; color: #065f46; font-size: 14px; margin-bottom: 5px; }
        .dua-text { font-size: 15px; color: #374151; margin-bottom: 10px; }
        
        .card-actions { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .amen-btn { background: #25D366; color: white; border: none; padding: 6px 14px; font-size: 13px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .amen-btn:hover { background: #1ebe5d; }
        .amen-btn.voted { background: #059669; }
        
        .share-btn { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 6px 12px; font-size: 13px; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 4px; text-decoration: none; }
        .share-btn:hover { background: #dbeafe; }

        .back-btn { display: inline-block; margin-top: 20px; color: #047857; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<!-- Website Header -->
<header style="background: #0f5132; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.15);">
  <a href="../index.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: white;">
    <img src="../logo-mobile.png" alt="दीनी दुआ" style="height: 32px; width: 32px; border-radius: 6px; object-fit: contain;">
    <span style="font-size: 1.15rem; font-weight: bold; letter-spacing: 0.5px;">दीनी दुआ</span>
  </a>
  <a href="../index.html" style="color: #d1fae5; text-decoration: none; font-size: 0.88rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.3); padding: 4px 10px; border-radius: 15px;">
    🏠 होम
  </a>
</header>

<div class="container">
    <h1>🤲 दुआ रिक्वेस्ट वॉल</h1>
    <p class="subtitle">अपनी परेशानी यहाँ साझा करें, भाई-बहन आपके लिए दुआ करेंगे</p>

    <!-- Form to Submit Dua -->
    <div class="form-group">
        <input type="text" id="userName" placeholder="अपना नाम या 'एक भाई/बहन'">
    </div>
    <div class="form-group">
        <textarea id="userDua" placeholder="अपनी दुआ या परेशानी यहाँ लिखें (जैसे: परीक्षा के लिए दुआ करें...)"></textarea>
    </div>
    <button class="submit-btn" onclick="postDua()">दुआ पोस्ट करें</button>

    <div class="wall-title">💬 हाल ही में मांगी गई दुआएं</div>
    
    <!-- List of Duas -->
    <div id="duaList"><p style="text-align:center; color:#777;">दुआएं लोड हो रही हैं...</p></div>

    <a href="../index.html" class="back-btn">← होमपेज पर वापस जाएं</a>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDIc_0jZ3GSziO_s1wBB3Cz5radLDqM7Rg",
        authDomain: "deenidua-a5413.firebaseapp.com",
        projectId: "deenidua-a5413",
        storageBucket: "deenidua-a5413.firebasestorage.app",
        messagingSenderId: "494498303568",
        appId: "1:494498303568:web:921f12b2d7962d2928cb55"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Fetch and display duas in real-time from Firestore
    function loadDuas() {
        const list = document.getElementById("duaList");

        db.collection("duas").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            list.innerHTML = "";

            if (snapshot.empty) {
                list.innerHTML = "<p style='text-align:center; color:#777;'>अभी कोई दुआ पोस्ट नहीं की गई है।</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const item = doc.data();
                const id = doc.id;
                
                const votedKey = "voted_dua_" + id;
                const isVoted = localStorage.getItem(votedKey) === "true";
                const amenCount = item.amenCount || 0;

                const card = document.createElement("div");
                card.className = "dua-card";
                card.innerHTML = `
                    <div class="dua-name">${escapeHtml(item.name)}</div>
                    <div class="dua-text">${escapeHtml(item.text)}</div>
                    <div class="card-actions">
                        <button class="amen-btn ${isVoted ? 'voted' : ''}" onclick="countAmen('${id}', ${isVoted}, ${amenCount})">
                            🤲 ${isVoted ? '✓ आमीन कहा गया' : 'आमीन'} (<span>${amenCount}</span>)
                        </button>
                        <button class="share-btn" onclick="shareDua('${escapeHtml(item.name)}', '${escapeHtml(item.text)}')">
                            📤 शेयर करें
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }, (error) => {
            list.innerHTML = "<p style='text-align:center; color:red;'>दुआएं लोड करने में त्रुटि हुई।</p>";
        });
    }

    // Post new Dua to Firestore
    async function postDua() {
        const nameInput = document.getElementById("userName");
        const duaInput = document.getElementById("userDua");
        
        const name = nameInput.value.trim();
        const dua = duaInput.value.trim();

        if (dua === "") {
            alert("कृपया दुआ या परेशानी जरूर लिखें!");
            return;
        }

        const displayName = name === "" ? "एक मुस्लिम भाई/बहन" : name;

        try {
            await db.collection("duas").add({
                name: displayName,
                text: dua,
                amenCount: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            nameInput.value = "";
            duaInput.value = "";
            alert("आपकी दुआ सफलतापूर्वक पोस्ट हो गई है! جزاك الله خيرًا");
        } catch (e) {
            alert("दुआ पोस्ट करने में दिक्कत आई। कृपया दोबारा कोशिश करें।");
        }
    }

    // Increment or Decrement Amen count safely
    async function countAmen(id, isVoted, currentCount) {
        const votedKey = "voted_dua_" + id;
        const docRef = db.collection("duas").doc(id);

        try {
            await db.runTransaction(async (transaction) => {
                const doc = await transaction.get(docRef);
                if (!doc.exists) return;

                let newCount = doc.data().amenCount || 0;

                if (!isVoted) {
                    newCount += 1;
                    localStorage.setItem(votedKey, "true");
                } else {
                    newCount = Math.max(0, newCount - 1);
                    localStorage.removeItem(votedKey);
                }

                transaction.update(docRef, { amenCount: newCount });
            });
        } catch (e) {
            console.log("Amen transaction error: ", e);
        }
    }

    // Share Dua Function (Copies short crisp text & link)
    function shareDua(name, text) {
        const shareText = `🤲 ${name} की दुआ:\n"${text}"\n\nआप भी दीनी दुआ वॉल पर आमीन कहें: ${window.location.href}`;
        
        navigator.clipboard.writeText(shareText).then(() => {
            alert("✅ दुआ का संदेश कॉपी हो गया है!\nअब आप इसे WhatsApp या कहीं भी शेयर कर सकते हैं।");
        }).catch(() => {
            prompt("इस लिंक को कॉपी करें:", window.location.href);
        });
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.onload = function() {
        loadDuas();
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    };
</script>

</body>
</html>
