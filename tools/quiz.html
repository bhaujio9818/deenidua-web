<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>दीनी क्विज़ | Islamic Knowledge Quiz</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .quiz-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 25px; margin-top: 20px; }
    .q-title { font-size: 1.2rem; color: #0f5132; margin-bottom: 18px; font-weight: bold; }
    .opt-btn { display: block; width: 100%; text-align: left; padding: 12px 16px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; background: #f8f9fa; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .opt-btn:hover { background: #e9ecef; }
    .correct { background: #d1e7dd !important; border-color: #0f5132 !important; color: #0f5132 !important; font-weight: bold; }
    .wrong { background: #f8d7da !important; border-color: #842029 !important; color: #842029 !important; }
    .nav-btn { background: #0f5132; color: white; border: none; padding: 10px 22px; border-radius: 20px; font-size: 0.95rem; cursor: pointer; margin-top: 15px; display: none; }
  </style>
</head>
<body>

<header>
  <a href="../index.html">← मुख्य पेज</a>
</header>

<div class="container">
  <div class="quiz-card" id="quizBox">
    <div id="quizContent">
      <div class="q-title" id="questionText">सवाल लोड हो रहा है...</div>
      <div id="optionsBox"></div>
      <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">अगला सवाल →</button>
    </div>
    <div id="resultBox" style="display:none; text-align:center; padding:20px;">
      <h2 style="color:#0f5132;">माशा-अल्लाह! क्विज़ मुकम्मल हुआ</h2>
      <p id="scoreText" style="font-size:1.3rem; margin:15px 0; font-weight:bold;"></p>
      <button class="nav-btn" style="display:inline-block;" onclick="restartQuiz()">दोबारा खेलें</button>
    </div>
  </div>
</div>

<script>
  const questions = [
    { q: "1. कुरआन पाक में कुल कितनी सूरहें हैं?", opts: ["112", "114", "110", "120"], ans: 1 },
    { q: "2. कुरआन मजीद की सबसे बड़ी सूरह कौन सी है?", opts: ["सूरह यासीन", "सूरह रहमान", "सूरह अल-बकरा", "सूरह मुल्क"], ans: 2 },
    { q: "3. इस्लाम के कितने बुनियादी अरकान (खंभे) हैं?", opts: ["3", "4", "5", "6"], ans: 2 },
    { q: "4. सबसे पहली वही किस मुकद्दस गार (गुफा) में नाज़िल हुई?", opts: ["गारे हिरा", "गारे सौर", "कोहे तूर", "गारे कहफ"], ans: 0 },
    { q: "5. कुरआन का दिल किस सूरह को कहा गया है?", opts: ["सूरह फातिहा", "सूरह इखलास", "सूरह मुल्क", "सूरह यासीन"], ans: 3 }
  ];

  let curQ = 0;
  let score = 0;

  function loadQ() {
    document.getElementById('nextBtn').style.display = 'none';
    const qData = questions[curQ];
    document.getElementById('questionText').innerText = qData.q;
    const optsContainer = document.getElementById('optionsBox');
    optsContainer.innerHTML = '';

    qData.opts.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = opt;
      btn.onclick = () => selectAns(idx, btn);
      optsContainer.appendChild(btn);
    });
  }

  function selectAns(chosenIdx, btn) {
    const correctIdx = questions[curQ].ans;
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.disabled = true);

    if (chosenIdx === correctIdx) {
      btn.classList.add('correct');
      score++;
    } else {
      btn.classList.add('wrong');
      allBtns[correctIdx].classList.add('correct');
    }
    document.getElementById('nextBtn').style.display = 'inline-block';
  }

  function nextQuestion() {
    curQ++;
    if (curQ < questions.length) {
      loadQ();
    } else {
      document.getElementById('quizContent').style.display = 'none';
      document.getElementById('resultBox').style.display = 'block';
      document.getElementById('scoreText').innerText = `आपका स्कोर: ${score} / ${questions.length}`;
    }
  }

  function restartQuiz() {
    curQ = 0;
    score = 0;
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('quizContent').style.display = 'block';
    loadQ();
  }

  window.onload = loadQ;
</script>

</body>
</html>
