<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ज़कात कैलकुलेटर</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
    .card { background: #fff; max-width: 450px; margin: auto; padding: 25px; border-radius: 10px; border: 1px solid #e0e0e0; }
    input { width: 100%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; }
    .btn { width: 100%; background: #0f5132; color: #fff; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
<div class="card">
  <a href="../index.html" style="color:#0f5132; font-weight:bold;">← मुख्य पेज</a>
  <h2 style="color:#0f5132; margin: 15px 0;">ज़कात कैलकुलेटर (2.5%)</h2>
  <label>नकद रकम (₹):</label><input type="number" id="cash" placeholder="0">
  <label>सोने/चांदी की कीमत (₹):</label><input type="number" id="gold" placeholder="0">
  <button class="btn" onclick="calc()">हिसाब लगाएं</button>
  <h3 id="res" style="margin-top:15px; color:#0f5132; text-align:center;"></h3>
</div>
<script>
  function calc() {
    let t = (parseFloat(document.getElementById('cash').value)||0) + (parseFloat(document.getElementById('gold').value)||0);
    document.getElementById('res').innerText = "कुल ज़कात: ₹ " + (t * 0.025).toFixed(2);
  }
</script>
</body>
</html>
