      color: #ffffff;

    /* Cards Grid */
    .preset-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;

    .preset-card-item {

      background: #f0fdf4;
      transform: translateY(-1px);
    }

    .preset-card-item .tag {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .preset-card-item p {
      margin: 0;
      font-size: 0.9rem;
      color: #1e293b;
      line-height: 1.5;
    }

    /* Custom Form Fields */
    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.86rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .custom-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #0f172a;

      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
      background: var(--surface);
    }

    .custom-input:focus {
      border-color: var(--primary);
    }

    textarea.custom-input {
      resize: vertical;
      min-height: 90px;
      line-height: 1.55;
    }

    /* Themes Palette */
    .themes-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0 8px 0;
    }

    .theme-swatch {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      flex-shrink: 0;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }

    .theme-swatch.active {
      transform: scale(1.15);
      border-color: #ffffff;
      box-shadow: 0 0 0 2px var(--primary);
    }

    /* Action Buttons */
    .action-row {
      display: flex;

    .btn-action {

    .btn-action.whatsapp {
      background: #25D366;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.35);
    }

    .btn-action:active {
      transform: scale(0.97);
    }
  </style>
</head>

      <label>👤 दुआगो / भेजने वाले का नाम (Sender Name):</label>
      <input type="text" id="senderNameInput" class="custom-input" placeholder="जैसे: मोहम्मद ज़ैद / आपका नाम" value="दीनी दुआ संग्रह" oninput="onCustomChange()">

    <!-- Font Size Settings -->

        <div class="theme-swatch" style="background: linear-gradient(135deg, #78350f, #3b1402);" onclick="pickTheme(2, this)" title="गोल्डन अंबर"></div>
        <div class="theme-swatch" style="background: linear-gradient(135deg, #831843, #4c0519);" onclick="pickTheme(3, this)" title="शाही रूबी"></div>
        <div class="theme-swatch" style="background: linear-gradient(135deg, #134e4a, #042f2e);" onclick="pickTheme(4, this)" title="एमराल्ड टील"></div>

<script>
  // 1. Ready-Made Curated Cards Data
  const readyCards = [
    {
      cat: "jumma",
      tag: "जुमा मुबारक",
      title: "जुमा की मुबारकबाद",
      text: "जुमा मुबारक! ऐ अल्लाह, इस मुबारक दिन के सदके हमारे गुनाहों को माफ़ फरमा और हमारी तमाम जायज़ दुआओं को कुबूल फरमा।",
      sender: "दीनी दुआ (deenidua.in)",
      themeIdx: 0
    },
    {
      cat: "jumma",
      tag: "जुमा मुबारक",
      title: "दुरूद शरीफ की फ़ज़ीलत",
      text: "जुमा के दिन मुझ पर कसरत से दुरूद शरीफ भेजा करो, क्योंकि तुम्हारा दुरूद मुझ पर पेश किया जाता है। (अबू दाऊद)",
      sender: "हज़रत मुहम्मद ﷺ",
      themeIdx: 0
    },
    {
      cat: "hadith",
      tag: "हदीस शरीफ",
      title: "पाकीज़गी आधा ईमान",
      text: "पाकीज़गी (सफाई) आधा ईमान है और अल्हम्दुलिल्लाह तराज़ू को नेकियों से भर देता है। (सहीह मुस्लिम)",
      sender: "सहीह मुस्लिम",
      themeIdx: 1
    },
    {
      cat: "hadith",
      tag: "हदीस शरीफ",
      title: "कुरआन की तालीम",
      text: "तुममें से सबसे बेहतरीन शख्स वह है जो कुरआन सीखे और दूसरों को सिखाए। (सहीह बुखारी)",
      sender: "सहीह बुखारी",
      themeIdx: 0
    },
    {
      cat: "hadith",
      tag: "हदीस शरीफ",
      title: "मुस्कुराना सदका है",
      text: "तुम्हारा अपने मोमिन भाई के सामने मुस्कुराना भी सदका है, और अच्छी बात कहना भी सदका है। (जामे तिर्मिज़ी)",
      sender: "जामे तिर्मिज़ी",
      themeIdx: 2
    },
    {
      cat: "quran",
      tag: "कुरआन मजीद",
      title: "सूरह इनशिराह",
      text: "बेशक मुश्किल के साथ आसानी है, यक़ीनन हर तंगी के बाद कुशादगी है। (अल-कुरआन 94:6)",
      sender: "सूरह इनशिराह (आयत 6)",
      themeIdx: 1
    },
    {
      cat: "quran",
      tag: "कुरआन मजीद",
      title: "अल्लाह की याद में सुकून",
      text: "सुनो! दिलों का सुकून सिर्फ और सिर्फ अल्लाह की याद (ज़िक्र) में ही है। (सूरह रा'द 13:28)",
      sender: "सूरह अर-रा'द",
      themeIdx: 4
    },
    {
      cat: "dua",
      tag: "मसनून दुआ",
      title: "रब्बना दुआ",
      text: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ\nऐ हमारे रब! हमें दुनिया में भी भलाई दे और आखिरत में भी भलाई दे और आग के अज़ाब से बचा।",
      sender: "सूरह बकरा (आयत 201)",
      themeIdx: 3
    },
    {
      cat: "dua",
      tag: "मसनून दुआ",
      title: "सैय्यदुल इस्तिग़फ़ार",
      text: "ऐ अल्लाह! तू ही मेरा रब है, तेरे सिवा कोई माबूद नहीं। तूने ही मुझे पैदा किया और मैं तेरे वादे पर क़ायम हूँ। मेरे गुनाह माफ़ फरमा।",
      sender: "तौबा व इस्तिग़फ़ार",
      themeIdx: 0
    }
  ];

  // 2. Visual Theme Profiles
  const themes = [
    { bg1: "#064e3b", bg2: "#022c22", border: "#d4af37", text: "#ffffff", sub: "#cbd5e1" }, // Medina Green
    { bg1: "#1e1b4b", bg2: "#090d16", border: "#93c5fd", text: "#ffffff", sub: "#94a3b8" }, // Midnight Royal
    { bg1: "#78350f", bg2: "#3b1402", border: "#fde68a", text: "#ffffff", sub: "#fde047" }, // Golden Amber
    { bg1: "#831843", bg2: "#4c0519", border: "#fbcfe8", text: "#ffffff", sub: "#fecdd3" }, // Imperial Ruby
    { bg1: "#134e4a", bg2: "#042f2e", border: "#5eead4", text: "#ffffff", sub: "#a7f3d0" }  // Emerald Teal
  ];

  const canvas = document.getElementById('statusCanvas');
  const ctx = canvas.getContext('2d');

  let activeThemeIdx = 0;
  let activeMode = 'ready';
  let currentCardText = readyCards[0].text;
  let currentSender = readyCards[0].sender;

  function switchMode(mode) {
    activeMode = mode;
    const tabReady = document.getElementById('tabReady');
    const tabCustom = document.getElementById('tabCustom');
    const panelReady = document.getElementById('readyModePanel');
    const panelCustom = document.getElementById('customModePanel');

    if (mode === 'ready') {
      tabReady.classList.add('active');
      tabCustom.classList.remove('active');
      panelReady.style.display = 'block';
      panelCustom.style.display = 'none';
    } else {
      tabCustom.classList.add('active');
      tabReady.classList.remove('active');
      panelCustom.style.display = 'block';
      panelReady.style.display = 'none';
      onCustomChange();
      return;
    }
    drawCanvas();
  }

  function renderReadyCardsList(list) {
    const container = document.getElementById('presetCardsList');
    container.innerHTML = '';
    list.forEach((item, index) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'preset-card-item' + (index === 0 ? ' selected' : '');
      cardEl.innerHTML = `
        <span class="tag">${item.tag} • ${item.title}</span>
        <p>${item.text.replace(/\n/g, ' ')}</p>
      `;
      cardEl.onclick = () => {
        document.querySelectorAll('.preset-card-item').forEach(c => c.classList.remove('selected'));
        cardEl.classList.add('selected');
        loadReadyCard(item);
      };
      container.appendChild(cardEl);
    });
  }

  function filterCategory(cat, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (cat === 'all') {
      renderReadyCardsList(readyCards);
    } else {
      const filtered = readyCards.filter(c => c.cat === cat);
      renderReadyCardsList(filtered);
    }
  }

  function loadReadyCard(card) {
    currentCardText = card.text;
    currentSender = card.sender;
    activeThemeIdx = card.themeIdx;
    
    const swatches = document.querySelectorAll('.theme-swatch');
    swatches.forEach((s, idx) => {
      s.classList.toggle('active', idx === activeThemeIdx);
    });

    drawCanvas();
  }

  function pickTheme(idx, elem) {
    activeThemeIdx = idx;
    document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
    elem.classList.add('active');
    drawCanvas();
  }

  function onCustomChange() {
    currentCardText = document.getElementById('customTextInput').value.trim() || "यहाँ अपनी पसंद की दुआ या पैगाम लिखें...";
    currentSender = document.getElementById('senderNameInput').value.trim();
    drawCanvas();
  }

  function drawCanvas() {
    const W = canvas.width;
    const H = canvas.height;
    const theme = themes[activeThemeIdx];
    const fontSize = parseInt(document.getElementById('fontSizeSlider').value) || 50;

    // 1. Background Gradient
    const bgGrad = ctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0, theme.bg1);
    bgGrad.addColorStop(1, theme.bg2);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // 2. Outer Ornamental Borders
    ctx.strokeStyle = theme.border;
    ctx.lineWidth = 6;
    ctx.strokeRect(50, 50, W - 100, H - 100);

    ctx.lineWidth = 2;
    ctx.strokeRect(64, 64, W - 128, H - 128);

    const drawCorner = (x, y) => {
      ctx.fillStyle = theme.border;
      ctx.fillRect(x - 8, y - 8, 16, 16);
    };
    drawCorner(64, 64);
    drawCorner(W - 64, 64);
    drawCorner(64, H - 64);
    drawCorner(W - 64, H - 64);

    // 3. Top Header: Bismillah Calligraphy
    ctx.textAlign = 'center';
    ctx.fillStyle = theme.border;
    ctx.font = "bold 65px 'Noto Naskh Arabic', serif, system-ui";
    ctx.fillText("بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ", W / 2, 175);

    // Gold Divider Accent
    ctx.fillRect(W / 2 - 90, 215, 180, 3);
    ctx.beginPath();
    ctx.arc(W / 2, 216, 6, 0, Math.PI * 2);
    ctx.fill();

    // 4. Main Body Text Rendering
    ctx.fillStyle = theme.text;
    ctx.font = `600 ${fontSize}px system-ui, -apple-system, sans-serif`;

    const maxWidth = W - 240;
    const lineHeight = fontSize * 1.55;

    const rawLines = currentCardText.split("\n");
    let allRenderLines = [];

    rawLines.forEach(para => {
      if (para.trim() === "") {
        allRenderLines.push("");
      } else {
        const wrapped = wrapParagraph(ctx, para, maxWidth);
        allRenderLines = allRenderLines.concat(wrapped);
      }
    });

    const totalTextHeight = allRenderLines.length * lineHeight;
    let startY = (H / 2) - (totalTextHeight / 2) + 20;

    if (startY < 270) startY = 270;

    allRenderLines.forEach(line => {
      ctx.fillText(line, W / 2, startY);
      startY += lineHeight;
    });

    // 5. Sender Signature / Reference
    if (currentSender) {
      ctx.fillStyle = theme.border;
      ctx.font = "bold 34px system-ui, sans-serif";
      ctx.fillText(`— ${currentSender}`, W / 2, H - 210);
    }

    // 6. Watermark Portal Branding
    ctx.fillStyle = theme.sub;
    ctx.font = "500 26px system-ui, sans-serif";
    ctx.fillText("deenidua.in", W / 2, H - 110);
  }

  function wrapParagraph(context, text, maxWidth) {
    const words = text.split(" ");
    const lines = [];
    let currentLine = "";

    for (let i = 0; i < words.length; i++) {
      const testLine = currentLine + words[i] + " ";
      const metrics = context.measureText(testLine);
      if (metrics.width < maxWidth) {
        currentLine = testLine;
      } else {
        lines.push(currentLine.trim());
        currentLine = words[i] + " ";
      }
    }
    lines.push(currentLine.trim());
    return lines;
  }

  function downloadHDCard() {
    const link = document.createElement('a');
    link.download = 'deenidua-status-card.png';
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
  }

  function shareToWhatsApp() {
    const shareText = encodeURIComponent(
      currentCardText + 
      (currentSender ? `\n— ${currentSender}` : "") + 
      "\n\n✨ रोज़ाना मसनून दुआएं और स्टेटस कार्ड बनाएं:\nhttps://www.deenidua.in/tools/card-generator.html"
    );
    window.open("https://api.whatsapp.com/send?text=" + shareText, '_blank');
  }

  window.addEventListener('DOMContentLoaded', () => {
    renderReadyCardsList(readyCards);
    loadReadyCard(readyCards[0]);
  });

  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
  }
</script>
