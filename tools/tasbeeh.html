<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>डिजिटल तस्बीह</title>
  <style>
    body { font-family: sans-serif; background: #0f5132; color: #fff; text-align: center; padding: 30px 20px; }
    .display { font-size: 5rem; font-weight: bold; margin: 20px 0; }
    .pad { width: 200px; height: 200px; border-radius: 50%; background: #198754; margin: auto; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; border: 5px solid #ffc107; cursor: pointer; }
    .pad:active { transform: scale(0.95); }
    .btn-reset { background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; margin-top: 30px; }
  </style>
</head>
<body>
<a href="../index.html" style="color:#d1e7dd; font-weight:bold;">← मुख्य पेज</a>
<h2>डिजिटल तस्बीह काउंटर</h2>
<div class="display" id="val">0</div>
<div class="pad" onclick="count()">टैप करें</div>
<button class="btn-reset" onclick="reset()">रीसेट करें</button>
<script>
  let n = parseInt(localStorage.getItem('tasbeeh_save')) || 0;
  document.getElementById('val').innerText = n;
  function count() { n++; document.getElementById('val').innerText = n; localStorage.setItem('tasbeeh_save', n); }
  function reset() { n = 0; document.getElementById('val').innerText = 0; localStorage.removeItem('tasbeeh_save'); }
</script>
</body>
</html>
