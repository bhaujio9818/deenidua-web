<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>किबला फाइंडर</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; text-align: center; padding: 20px; }
    .card { background: #fff; max-width: 450px; margin: auto; padding: 25px; border-radius: 10px; border: 1px solid #e0e0e0; }
    .compass { width: 200px; height: 200px; border-radius: 50%; border: 5px solid #0f5132; margin: 20px auto; position: relative; display: flex; align-items: center; justify-content: center; background: #e8f5e9; }
    .arrow { width: 8px; height: 80px; background: red; position: absolute; top: 20px; transform-origin: bottom center; }
    .btn { background: #0f5132; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
  </style>
</head>
<body>
<a href="../index.html" style="color:#0f5132; font-weight:bold;">← मुख्य पेज</a>
<div class="card" style="margin-top:20px;">
  <h2>किबला कंपास</h2>
  <div class="compass"><div class="arrow" id="arrow"></div><strong>काबा</strong></div>
  <button class="btn" onclick="getQibla()">दिशा देखें</button>
  <p id="qiblaText" style="margin-top:10px; font-size:0.9rem;"></p>
</div>
<script>
  function getQibla() {
    navigator.geolocation.getCurrentPosition(pos => {
      let lat = pos.coords.latitude * Math.PI / 180, lon = pos.coords.longitude * Math.PI / 180;
      let mLat = 21.4225 * Math.PI / 180, mLon = 39.8262 * Math.PI / 180;
      let y = Math.sin(mLon - lon), x = Math.cos(lat) * Math.tan(mLat) - Math.sin(lat) * Math.cos(mLon - lon);
      let angle = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
      document.getElementById('arrow').style.transform = `rotate(${angle}deg)`;
      document.getElementById('qiblaText').innerText = `कोण: लगभग ${Math.round(angle)}° उत्तर से`;
    });
  }
</script>
</body>
</html>
